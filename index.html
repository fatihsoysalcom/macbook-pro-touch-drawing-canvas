<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Drawing Canvas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        #drawingCanvas {
            border: 2px solid #333;
            background-color: white;
            cursor: crosshair; /* Indicates drawing area */
            touch-action: none; /* Prevent browser default touch actions like scrolling/zooming */
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            border-radius: 5px;
            overflow: hidden; /* Hide default color picker border */
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 5px;
        }
        input[type="range"] {
            width: 100px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Dokunmatik Çizim Tahtası (Touch Drawing Board)</h1>
    <canvas id="drawingCanvas" width="800" height="500"></canvas>
    <div class="controls">
        <button id="clearBtn">Temizle (Clear)</button>
        <label for="colorPicker">Renk:</label>
        <input type="color" id="colorPicker" value="#000000">
        <label for="penSizeSlider">Kalem Boyutu:</label>
        <input type="range" id="penSizeSlider" min="1" max="20" value="5">
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const colorPicker = document.getElementById('colorPicker');
        const penSizeSlider = document.getElementById('penSizeSlider');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = colorPicker.value;
        let penSize = parseInt(penSizeSlider.value);

        // Set initial drawing styles
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // Function to get coordinates relative to the canvas
        function getCoords(event) {
            const rect = canvas.getBoundingClientRect();
            // Handle touch events
            if (event.touches && event.touches.length > 0) {
                return {
                    x: event.touches[0].clientX - rect.left,
                    y: event.touches[0].clientY - rect.top
                };
            }
            // Handle mouse events
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoords(e);
            [lastX, lastY] = [coords.x, coords.y];
            // Start a new path immediately for a dot if no movement
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(lastX, lastY);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = penSize;
            ctx.stroke();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // Prevent scrolling on touch devices

            const coords = getCoords(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = penSize;
            ctx.stroke();
            [lastX, lastY] = [coords.x, coords.y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // --- Event Listeners for Mouse (for non-touch devices) ---
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing); // Stop drawing if mouse leaves canvas

        // --- Event Listeners for Touch (demonstrates the article's core concept: intuitive touch interaction) ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent default browser actions like scrolling/zooming
            startDrawing(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent default browser actions
            draw(e);
        });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing); // Handle cases where touch is interrupted

        // --- Control Buttons ---
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        penSizeSlider.addEventListener('input', (e) => {
            penSize = parseInt(e.target.value);
        });

        // Initial clear to ensure a clean canvas on load
        ctx.clearRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
